name: Stocks activation reminders

on:
  schedule:
    # 03:12 UTC daily = 08:42 IST -- same "daily cron, self-gates on
    # Monday internally" pattern as stocks-starters-weekly-email.yml (see
    # /stocks/notifications/send-activation-reminders, which always calls
    # record_job_success so the daily missed-job check stays meaningful
    # for this job too). Minute deliberately off the :00/:15/:30/:45
    # marks -- see stocks-shortlist-refresh.yml's comment for why.
    - cron: '12 3 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/notifications/send-activation-reminders
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/notifications/send-activation-reminders)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
