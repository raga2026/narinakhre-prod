name: Stocks news sync

on:
  schedule:
    # 00:04 UTC daily = 05:34 IST -- no price/fundamentals dependency, so
    # this runs independently of price_sync/fundamentals rotation. Fetches
    # Google News RSS headlines for every active stock_watchlist company
    # (see utils/stock_news.py). Triggers POST /stocks/news/sync. Minute
    # deliberately off the :00/:15/:30/:45 marks -- see
    # stocks-shortlist-refresh.yml's comment for why.
    - cron: '4 0 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/news/sync
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 1100 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/news/sync)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
