name: Stocks fundamentals rotation sync

on:
  schedule:
    # 05:30 UTC daily = 11:00 IST -- before market open, after the previous
    # day's price sync. Refreshes the 300 stalest scrape-eligible companies
    # each run (~1,067 eligible total, so the full set cycles roughly every
    # 4 days). Triggers POST /stocks/fundamentals/rotation-sync.
    - cron: '30 5 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/fundamentals/rotation-sync
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 1100 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/fundamentals/rotation-sync)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
