name: Stocks fundamentals rotation sync

on:
  schedule:
    # 05:38 UTC daily = 11:08 IST -- before market open, after the previous
    # day's price sync. Refreshes the ROTATION_BATCH_SIZE stalest
    # scrape-eligible companies each run (~1,067 eligible total, 75/day, so
    # the full set cycles roughly every 15 days) -- this is the only
    # Screener.in scraping this app does, deliberately cron-only (see
    # /stocks/fundamentals/rotation-sync in app.py). Triggers
    # POST /stocks/fundamentals/rotation-sync. Minute deliberately off the
    # :00/:15/:30/:45 marks -- see stocks-shortlist-refresh.yml's comment
    # for why.
    - cron: '38 5 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/fundamentals/rotation-sync
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 1100 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/fundamentals/rotation-sync)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
