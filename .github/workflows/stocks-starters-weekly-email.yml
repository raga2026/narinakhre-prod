name: Stocks Starters weekly email

on:
  schedule:
    # 02:19 UTC daily = 07:49 IST -- shortly after stocks-suggestions-email.yml
    # (02:09 UTC, needs the same day's stock_indicators rows), on its own
    # minute rather than sharing an exact time slot with it -- see
    # stocks-shortlist-refresh.yml's comment for why. Runs every day, not just
    # Monday: /stocks/starters/send-weekly-email's own job body checks the
    # weekday and is_trading_day() and only does real work on a Monday
    # trading day, recording success either way -- see utils/stock_alerting.py's
    # JOB_EXPECTATIONS comment for why this needs no day-of-week awareness here.
    - cron: '19 2 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/starters/send-weekly-email
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/starters/send-weekly-email)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
