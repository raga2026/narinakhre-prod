name: Stocks auto-trader reconciliation (dry run)

on:
  schedule:
    # 01:41 UTC daily = 07:11 IST -- after price_sync (00:37 UTC), before
    # suggestion_email, so a target/stop hit closes same-day against that
    # morning's freshly synced price. Triggers POST
    # /stocks/auto-trader/reconcile, which closes any open dry-run
    # simulated trade whose price has reached its target or stop-loss --
    # see utils/auto_trader.py. A no-op if the dry-run simulation has never
    # been enabled from /stocks/auto-trader. Minute deliberately off the
    # :00/:15/:30/:45 marks -- see stocks-shortlist-refresh.yml's comment
    # for why.
    - cron: '41 1 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/auto-trader/reconcile
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 120 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/auto-trader/reconcile)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
