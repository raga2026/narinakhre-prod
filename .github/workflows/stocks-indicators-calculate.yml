name: Stocks indicators calculate

on:
  schedule:
    # 01:23 UTC daily = 06:53 IST -- ~45 minutes after stocks-price-sync.yml
    # (00:37 UTC), giving that run a comfortable buffer to finish before
    # this one reads its output. Indicators need that day's price data to
    # already be in stock_daily_data (see utils/stock_indicators.py), so
    # this must run after, never before or in parallel with, price sync.
    # Minute deliberately off the :00/:15/:30/:45 marks -- see
    # stocks-shortlist-refresh.yml's comment for why.
    - cron: '23 1 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/indicators/calculate
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 300 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/indicators/calculate)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
