name: Stocks fundamentals sync

on:
  schedule:
    # Monday 06:00 UTC, once a week -- fundamentals don't move day to day.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /cron/stocks-fundamentals-sync
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/cron/stocks-fundamentals-sync)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
