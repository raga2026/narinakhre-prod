name: Stocks check missed jobs

on:
  schedule:
    # 10:30 UTC = 16:00 IST -- comfortably after every job's expected-by
    # time (the latest is market_cap_filter at 1 PM IST, see
    # utils/stock_alerting.py's JOB_EXPECTATIONS). Triggers
    # POST /stocks/alerts/check-missed-jobs.
    - cron: '30 10 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: POST to /stocks/alerts/check-missed-jobs
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" --max-time 60 -X POST \
            -H "X-Cron-Secret: ${{ secrets.STOCKS_FUNDAMENTALS_CRON_SECRET }}" \
            https://narinakhre.com/stocks/alerts/check-missed-jobs)
          echo "HTTP status: $status"
          cat /tmp/response.txt
          if [ "$status" != "200" ]; then
            echo "Request failed"
            exit 1
          fi
