services:
  - type: web
    name: narinakhre-test
    plan: Free
    runtime: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --timeout 1200 app:app"
    domains:
      - test-retail.narinakhre.com
      - test-wholesale.narinakhre.com

  - type: web
    name: narinakhre-production
    plan: Starter
    runtime: python
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --timeout 1200 app:app"
    domains:
      - narinakhre.com
      - www.narinakhre.com
      - wholesale.narinakhre.com
      - www.stoqbell.com
      - stoqbell.com
    envVars:
      # Shared secret for POST /cron/weekly-report -- the caller is a
      # GitHub Actions workflow (.github/workflows/weekly-report.yml), not
      # a Render Cron Job (that cost a second paid Starter-plan service for
      # what was ever only one HTTP POST a week -- moved off Render
      # 2026-08-21). Set via the Render dashboard (sync: false means Render
      # won't overwrite it on deploy) to the same value as the
      # WEEKLY_REPORT_CRON_SECRET repo secret on GitHub.
      - key: WEEKLY_REPORT_CRON_SECRET
        sync: false
      # Shared secret for every Stocks cron-triggered route (price sync,
      # indicator calc, fundamentals rotation scrape, etc.) -- the caller
      # is always a GitHub Actions workflow (.github/workflows/stocks-*.yml),
      # not a Render Cron Job, so there's no matching second copy of this
      # var anywhere in this file. Set the same value as the
      # STOCKS_FUNDAMENTALS_CRON_SECRET repo secret on GitHub.
      - key: STOCKS_FUNDAMENTALS_CRON_SECRET
        sync: false
