<!--
Synthetic fixture approximating Screener.in's company page structure --
used only to test utils/screener_client.py's parser. Not a captured real
page and "TESTCO" is not a real company -- values are made up. The
top-ratios list and ranges-table (growth) structure below were corrected to
match the REAL structure confirmed by fetching an actual Screener.in page
while extending this parser (see screener_client.py's docstrings) -- the
original version of this fixture had growth data under a plain <h2> heading
with a "1 Year:" row, which turned out not to match any real page at all;
the real structure is a <table class="ranges-table"> with a
<th colspan="2"> label and a "TTM:" row instead.
-->

<body>
