<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks Admin Login - NariNakhre</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #0f172a inset !important;
            caret-color: #ffffff;
        }
        .stocks-btn { background: linear-gradient(90deg, #0891b2 0%, #0ea5e9 100%); color: white; }
        .stocks-accent { color: #0ea5e9; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md mx-auto bg-slate-800 rounded-2xl shadow-2xl p-8 border border-sky-500/20">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold stocks-accent font-serif">Nari Nakhre Stocks</h1>
            <p class="text-slate-400 text-sm mt-1">Admin Login</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mb-6" role="alert" aria-live="assertive">
            {% for category, msg in messages %}
                <div class="bg-sky-900/40 text-sky-200 border border-sky-500/30 rounded-xl p-3 mb-2 text-sm">{{ msg }}</div>
            {% endfor %}
            </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('stocks_admin_login') }}" class="space-y-5" id="stocks-login-form">
            <input type="hidden" name="recaptcha_token" id="stocks-recaptcha-token">
            <div>
                <label for="stocks-username" class="block text-sm font-semibold text-slate-300 mb-1">Username</label>
                <input
                    id="stocks-username"
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                    style="color:#ffffff;-webkit-text-fill-color:#ffffff;background-color:#0f172a;"
                    class="w-full bg-slate-900 border border-sky-500/30 rounded-xl p-3 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label for="stocks-password" class="block text-sm font-semibold text-slate-300 mb-1">Password</label>
                <div class="relative">
                    <input
                        id="stocks-password"
                        type="password"
                        name="password"
                        required
                        autocomplete="current-password"
                        style="color:#ffffff;-webkit-text-fill-color:#ffffff;background-color:#0f172a;"
                        class="w-full bg-slate-900 border border-sky-500/30 rounded-xl p-3 pr-12 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
                    <button type="button" id="stocks-password-toggle" aria-pressed="false"
                            aria-label="Show password" aria-controls="stocks-password"
                            class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-sky-400">
                        <svg id="stocks-password-toggle-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="stocks-btn w-full py-3 rounded-2xl font-bold text-lg shadow-lg mt-2 transition hover:opacity-90">
                Login
            </button>
        </form>

        <p class="text-center text-slate-600 text-xs mt-8">Nari Nakhre Stocks &copy; 2026. Authorised Access Only.</p>
    </div>

    <script>
    (function() {
        const input = document.getElementById('stocks-password');
        const toggle = document.getElementById('stocks-password-toggle');
        const icon = document.getElementById('stocks-password-toggle-icon');
        if (!input || !toggle || !icon) return;

        const EYE = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
        const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.5 10.5 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

        toggle.addEventListener('click', function() {
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            toggle.setAttribute('aria-pressed', String(!showing));
            toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
            icon.innerHTML = showing ? EYE : EYE_OFF;
        });
    })();
    </script>

    {% if recaptcha_site_key %}
    <script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key }}"></script>
    <script>
    (function() {
        const form = document.getElementById('stocks-login-form');
        if (!form) return;
        form.addEventListener('submit', function(e) {
            if (form.dataset.recaptchaDone === 'true') return; // token already attached, allow submit
            e.preventDefault();
            grecaptcha.ready(function() {
                grecaptcha.execute('{{ recaptcha_site_key }}', {action: 'stocks_admin_login'}).then(function(token) {
                    document.getElementById('stocks-recaptcha-token').value = token;
                    form.dataset.recaptchaDone = 'true';
                    form.submit();
                }).catch(function() {
                    // If reCAPTCHA fails client-side, submit anyway -- server-side
                    // verify_recaptcha() fails open too when it can't reach Google.
                    form.dataset.recaptchaDone = 'true';
                    form.submit();
                });
            });
        });
    })();
    </script>
    {% endif %}
</body>
</html>
