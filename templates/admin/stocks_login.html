<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocks Admin Login - NariNakhre</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #f8fafc; }
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #0f172a inset !important;
            caret-color: #ffffff;
        }
        .stocks-btn { background: linear-gradient(90deg, #0891b2 0%, #0ea5e9 100%); color: white; }
        .stocks-accent { color: #0ea5e9; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md mx-auto bg-slate-800 rounded-2xl shadow-2xl p-8 border border-sky-500/20">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold stocks-accent font-serif">Nari Nakhre Stocks</h1>
            <p class="text-slate-400 text-sm mt-1">Admin Login</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mb-6" role="alert" aria-live="assertive">
            {% for category, msg in messages %}
                <div class="bg-sky-900/40 text-sky-200 border border-sky-500/30 rounded-xl p-3 mb-2 text-sm">{{ msg }}</div>
            {% endfor %}
            </div>
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('stocks_admin_login') }}" class="space-y-5" id="stocks-login-form">
            <input type="hidden" name="recaptcha_token" id="stocks-recaptcha-token">
            <div>
                <label for="stocks-username" class="block text-sm font-semibold text-slate-300 mb-1">Username</label>
                <input
                    id="stocks-username"
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                    style="color:#ffffff;-webkit-text-fill-color:#ffffff;background-color:#0f172a;"
                    class="w-full bg-slate-900 border border-sky-500/30 rounded-xl p-3 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
            </div>

            <div>
                <label for="stocks-password" class="block text-sm font-semibold text-slate-300 mb-1">Password</label>
                <input
                    id="stocks-password"
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    style="color:#ffffff;-webkit-text-fill-color:#ffffff;background-color:#0f172a;"
                    class="w-full bg-slate-900 border border-sky-500/30 rounded-xl p-3 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition">
            </div>

            <button type="submit" class="stocks-btn w-full py-3 rounded-2xl font-bold text-lg shadow-lg mt-2 transition hover:opacity-90">
                Login
            </button>
        </form>

        <p class="text-center text-slate-600 text-xs mt-8">Nari Nakhre Stocks &copy; 2026. Authorised Access Only.</p>
    </div>

    {% if recaptcha_site_key %}
    <script src="https://www.google.com/recaptcha/api.js?render={{ recaptcha_site_key }}"></script>
    <script>
    (function() {
        const form = document.getElementById('stocks-login-form');
        if (!form) return;
        form.addEventListener('submit', function(e) {
            if (form.dataset.recaptchaDone === 'true') return; // token already attached, allow submit
            e.preventDefault();
            grecaptcha.ready(function() {
                grecaptcha.execute('{{ recaptcha_site_key }}', {action: 'stocks_admin_login'}).then(function(token) {
                    document.getElementById('stocks-recaptcha-token').value = token;
                    form.dataset.recaptchaDone = 'true';
                    form.submit();
                }).catch(function() {
                    // If reCAPTCHA fails client-side, submit anyway -- server-side
                    // verify_recaptcha() fails open too when it can't reach Google.
                    form.dataset.recaptchaDone = 'true';
                    form.submit();
                });
            });
        });
    })();
    </script>
    {% endif %}
</body>
</html>
