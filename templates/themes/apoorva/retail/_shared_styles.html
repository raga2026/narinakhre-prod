{#- Apoorva theme: CSS shared by every real retail page (currently
   retail/index.html and retail/product_detail.html), included inside each
   page's own <style> block -- e.g. {% include "retail/_shared_styles.html" %}.
   Still "inline styles, not a separate stylesheet file" per the theme's own
   convention (this is a Jinja template partial, not a linked .css asset) --
   it just avoids the color/font/token block drifting out of sync between
   pages as more of them get built. Page-specific styles (hero, quickstrip,
   signup band, product-detail's gallery/lightbox, etc.) stay inline in each
   page's own <style>, not here. -#}
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600;1,9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#2b1810; --ivory:#faf6f0; --ivory-deep:#f2e9dd;
  --wine:#6b1e3c; --wine-deep:#4a1329;
  --marigold:#e8a33d; --marigold-deep:#c8842a;
  --rose:#d46a8c; --line:#e6dccb;
}

/* ── Restyle the real header/footer (rendered via {{ "{{ super() }}" }} from
     retail/base.html) to the Apoorva palette -- colors/fonts/spacing only.
     Every selector here already exists in retail/base.html's own CSS; none
     of the show/hide/positioning rules that make search, the categories/
     profile dropdowns, and the mobile nav actually work are touched -- this
     block only ever changes color, background, border-color and
     font-family, and wins the cascade purely by appearing later in the
     document (this <style> renders inside <body>, after retail/base.html's
     <head> styles), not by overriding anything structurally. ── */
/* A flat single-tone background reads as stark/empty over large sections
   of mostly-white product cards -- a soft, fixed diagonal gradient between
   the theme's own ivory tones (plus a faint warm blush) gives the page
   some depth without introducing new colors or hurting text contrast
   (still effectively the same near-white lightness everywhere). */
body.retail {
  background: linear-gradient(160deg, var(--ivory) 0%, var(--ivory-deep) 55%, #f7e9e4 100%) fixed;
  font-family:'Work Sans', sans-serif; color: var(--ink);
}
h1, h2, h3 { font-family:'Fraunces', serif; }
.site-header { background: var(--ivory); border-bottom: 1px solid var(--line); box-shadow:none; }
.site-logo span { font-family:'Fraunces', serif; font-style:italic; color: var(--wine); }
.hamburger span { background: var(--wine); }
.mobile-home-icon svg, .mobile-cart-icon svg { stroke: var(--wine); }
.search-input { border-color: var(--line); background: var(--ivory-deep); color: var(--ink); }
.search-input:focus { border-color: var(--wine); background: #fff; }
.search-icon { color: var(--wine); opacity:.7; }
.desktop-nav a, .desktop-nav button.nav-signin-btn, .cat-dropdown-btn { color: var(--wine); }
.desktop-nav a:hover, .cat-dropdown-btn:hover { background: var(--ivory-deep); }
.cart-count { background: var(--marigold); color: var(--ink); }
.cat-menu { border-color: var(--line); }
.cat-menu a { color: var(--wine); font-family:'Fraunces', serif; }
.cat-menu a:hover { background: var(--ivory-deep); }
.mobile-nav { border-color: var(--line); }
.mobile-nav > a, .mobile-nav > button.nav-signin-btn, .mobile-cat-toggle { color: var(--wine); font-family:'Fraunces', serif; }
.mobile-cat-list a { color: var(--wine); }
.pincode-bar { background: var(--ivory-deep); }
.pincode-check-btn { background: var(--ink); }
.mobile-cat-pill-btn { border-color: var(--marigold); color: var(--wine); }
.home-auth-links button { color: var(--wine); }
.retail-footer { background: var(--ivory-deep); border-top-color: var(--wine); }
.retail-footer .footer-links a { color: var(--wine); }
.retail-footer .footer-copy div:last-child a { color: var(--wine); }

/* ── Mobile category strip (see _mobile_cat_strip.html, added in the
     header block) ── */
.mobile-cat-strip {
    display:none; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    background: var(--ivory-deep); border-top:1px solid var(--line);
}
.mobile-cat-strip::-webkit-scrollbar { display:none; }
.mobile-cat-strip ul { list-style:none; display:flex; gap:1.2rem; margin:0; padding:.6rem 1rem; white-space:nowrap; }
.mobile-cat-strip a { text-decoration:none; color:var(--wine); font-size:.76rem; font-weight:700; letter-spacing:.02em; text-transform:uppercase; }
@media (max-width:767px) { .mobile-cat-strip { display:block; } }

/* ── Skip link ── */
.skip-link{ position:absolute; left:-999px; top:0; background:var(--ink); color:var(--ivory); padding:.75rem 1.25rem; z-index:300; text-decoration:none; }
.skip-link:focus{ left:1rem; top:1rem; }

/* ── Shared CTA button (hero, "View All" links, signup band, etc.) ── */
.cta-btn{ display:inline-block; background:var(--marigold); color:var(--ink); font-weight:700; text-decoration:none; padding:.75rem 1.5rem; border-radius:999px; font-size:.88rem; letter-spacing:.02em; border:none; cursor:pointer; }
.cta-btn:hover, .cta-btn:focus-visible{ background:var(--ivory); }

/* ── Offers / announcement carousel -- SAME public_coupons/carousel_products
     markup and JS on every page that uses it (the homepage's full-size one,
     product_detail's compact one -- see .offers-carousel--compact there),
     only restyled to the reference's slimmer top-bar look. This is the base
     structural CSS (position/opacity stacking, colors, typography) --
     without it a page's offers carousel renders as unstyled stacked HTML
     (every slide visible at once, no absolute positioning) instead of a
     rotating banner, which is exactly what was broken on the product detail
     page until this moved out of home.html's own <style> and in here. ── */
.offers-carousel { position:relative; overflow:hidden; min-height:88px; background: var(--wine); }
.offers-carousel::before { content:""; position:absolute; inset:0; pointer-events:none; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.06) 0 3px, transparent 3px 14px); }
.offers-slide { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px 16px; opacity:0; transition:opacity .5s ease; pointer-events:none; }
.offers-slide.active { opacity:1; pointer-events:auto; }
.offer-discount-line { display:flex; align-items:baseline; gap:6px; }
.offer-discount-big { font-family:'Fraunces', serif; font-weight:700; font-size:1.4rem; color:var(--ivory); line-height:1.1; }
.offer-discount-cap { font-size:.68rem; color:var(--ivory); opacity:.85; font-weight:700; }
.offer-code-row { display:flex; align-items:center; gap:6px; margin-top:4px; }
.offer-code-label { font-size:.6rem; color:var(--ivory); opacity:.85; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.offer-code-inline { background:var(--marigold); border:none; border-radius:6px; padding:2px 10px; font-family:monospace; font-weight:800; font-size:.72rem; color:var(--ink); letter-spacing:.4px; cursor:pointer; }
.offer-product-slide { text-decoration:none; }
.offer-product-card { display:flex; align-items:center; gap:12px; background:var(--ivory); border:1px solid rgba(255,255,255,.4); border-radius:16px; padding:8px 14px; box-shadow:0 4px 16px rgba(0,0,0,.25); width:calc(100% - 32px); max-width:460px; }
.offer-product-img-wrap { position:relative; width:44px; height:44px; flex-shrink:0; border-radius:10px; background:var(--ivory-deep); display:flex; align-items:center; justify-content:center; }
.offer-product-img { max-width:100%; max-height:100%; object-fit:contain; }
.offer-product-badge { position:absolute; top:-8px; left:-8px; background:var(--wine); color:var(--ivory); font-weight:800; font-size:.58rem; padding:2px 6px; border-radius:8px; white-space:nowrap; }
.offer-product-price { display:flex; flex-direction:column; align-items:flex-start; flex-shrink:0; padding-right:10px; border-right:1.5px solid var(--line); }
.offer-product-mrp { font-size:.6rem; color:#9a8f80; text-decoration:line-through; }
.offer-product-current { font-size:.9rem; font-weight:800; color:var(--wine); line-height:1.2; }
.offer-product-title { flex:1; min-width:0; text-align:left; font-size:.72rem; font-weight:700; color:var(--ink); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
@media (min-width:768px) {
  .offers-carousel { min-height:104px; }
  .offer-discount-big { font-size:1.9rem; }
  .offer-product-card { max-width:600px; padding:12px 20px; gap:16px; }
  .offer-product-img-wrap { width:64px; height:64px; }
}

/* ── Product shelf: "coverflow" carousel -- the card nearest the shelf's
     center scales up to full size/opacity, neighbors shrink and dim, and
     CSS scroll-snap centers whichever card you drag/swipe to nearest.
     Shared by every horizontally-scrolling product row on any page
     (Trending, category shelves, "You May Also Like", etc). The actual
     scale/opacity math lives in --focus, a 0..1 custom property the shared
     JS (_shared_scripts.html) sets per-card on every scroll frame based on
     real distance from center; a plain CSS transition on top of that is
     what gives the "liquid" easing rather than a snap-into-place jump.
     Falls back to a plain full-scale, full-opacity static shelf (still
     scrollable, still functional) if JS ever fails to run, since --focus
     defaults to 1 with no JS setting it otherwise. ── */
.coverflow-shelf{
    --card-w: 250px;
    display:flex; gap:1.1rem; overflow-x:auto; padding:1rem 0 .5rem;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.coverflow-shelf::-webkit-scrollbar{ display:none; }
/* Lets the FIRST and LAST cards reach true center too, instead of only
   being able to scroll as far as the shelf's own edge. */
.coverflow-shelf::before, .coverflow-shelf::after{
    content:""; flex:0 0 calc(50% - (var(--card-w) / 2));
}
@media (max-width:767px){ .coverflow-shelf{ --card-w: 205px; gap:.85rem; } }

.coverflow-card{
    flex:0 0 var(--card-w); width:var(--card-w);
    scroll-snap-align:center;
    transform:scale(calc(0.8 + 0.2 * var(--focus, 1)));
    opacity:calc(0.55 + 0.45 * var(--focus, 1));
    transition:transform .35s cubic-bezier(.22,.61,.36,1), opacity .35s ease;
}
@media (prefers-reduced-motion: reduce){ .coverflow-card{ transition:none; } }

/* ── Shared product-card component (Trending, category shelves, related
     products) -- outer card box, image area, name/price typography, cart
     controls. Page-specific card TREATMENT (e.g. a different width) can
     still override these per-page since this loads before any page's own
     <style> content. ── */
.product-card, .prod-card{ background:#fff; border-radius:16px; padding:.45rem; box-shadow:0 2px 10px rgba(107,30,60,.08); border:1px solid var(--line); position:relative; display:flex; flex-direction:column; text-decoration:none; color:var(--ink); }
/* ── Image area -- sized by card-image-wrap (aspect-ratio lives here now,
     not on card-media itself) so the small floating Add button below can
     be absolutely positioned inside the SAME box as the image without
     nesting a <button> inside the <a> that makes the image clickable
     (invalid HTML -- interactive elements can't nest). Making the button
     float over the image instead of taking its own full-width row below
     is what lets the image itself run bigger in the same card height. ── */
.card-image-wrap{ position:relative; aspect-ratio:4/5; border-radius:12px; margin-bottom:.7rem; }
.card-media{ position:absolute; inset:0; display:block; border-radius:12px; overflow:hidden; background:var(--ivory-deep); }
.card-media .prod-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
/* ── Per-card image carousel -- each product's own photos crossfade on a
     timer (see initCardImageCarousels in _shared_scripts.html), independent
     of whichever card the coverflow shelf currently has in focus. Two
     stacked <img> layers ping-pong: JS loads the next photo into whichever
     layer is currently hidden, then swaps which one has .is-front. A
     product with only one photo never gets a second <img> layer at all
     (see the Jinja in each page), so it just sits still. get_product_images()
     server-side always returns up to 9 SKU_1..SKU_9 URL slots regardless of
     how many actually exist, so initCardImageCarousels pre-validates which
     ones really load before cycling -- otherwise this would crossfade
     through several blank/broken images for any product with fewer than 9
     real photos. ── */
.card-img-layer{ opacity:0; transition:opacity .6s ease; }
.card-img-layer.is-front{ opacity:1; }
@media (prefers-reduced-motion: reduce){ .card-img-layer{ transition:none; } }
.card-badge{ position:absolute; top:.6rem; left:.6rem; background:var(--ivory); color:var(--wine); font-size:.66rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; letter-spacing:.02em; z-index:2; }
.share-btn{ position:absolute; top:.5rem; right:.5rem; background:var(--ivory); border:none; border-radius:50%; padding:6px; cursor:pointer; z-index:3; }

.prod-name{ font-weight:600; font-size:.82rem; margin:0 0 .2rem; color:var(--ink); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.prod-price-wrap{ display:flex; align-items:baseline; gap:.35rem; flex-wrap:wrap; margin:.1rem 0 .3rem; }
.prod-mrp{ font-size:.68rem; color:#9a8f80; text-decoration:line-through; }
.prod-disc{ font-size:.62rem; font-weight:800; color:#16a34a; background:#dcfce7; border-radius:5px; padding:1px 5px; }
.prod-price{ font-size:.92rem; font-weight:800; color:var(--wine); }

.input-field{ width:100%; border:1px solid var(--line); border-radius:6px; padding:3px 6px; font-size:.72rem; margin-bottom:3px; }

/* ── Blinkit-style mini cart control -- floats at the bottom-right of the
     card's image instead of a full-width button row, so the image gets to
     be the largest thing on the card. Still the exact same JS-required
     classes (.cart-container/.add-to-cart-btn/.unit-counter/etc, see
     retail_cart.js) -- only the visual treatment changes via this .mini
     modifier. No "Buy Now" here (Blinkit's own pattern doesn't have one on
     the card either) -- that stays on the full product detail page. ── */
.cart-container.mini{ position:absolute; right:.5rem; bottom:.5rem; z-index:4; display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; }
.mini-add-btn{ background:#fff; border:1.5px solid var(--wine); color:var(--wine); font-weight:800; font-size:.72rem; padding:.35rem .85rem; border-radius:999px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.18); display:flex; align-items:center; gap:.15rem; line-height:1; }
.mini-add-btn:hover{ background:var(--ivory-deep); }
.mini-oos-badge{ background:rgba(229,231,235,.95); color:#6b7280; font-size:.66rem; font-weight:700; padding:.35rem .7rem; border-radius:999px; }
.cart-container.mini .unit-counter{ background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.18); margin-bottom:0; }
.unit-counter{ border:1.5px solid var(--marigold); background:var(--ivory-deep); border-radius:999px; display:flex; align-items:center; justify-content:space-between; padding:2px 8px; margin-bottom:3px; }
.unit-counter button{ width:22px; height:22px; border-radius:50%; background:var(--ivory); border:none; font-size:.9rem; font-weight:bold; color:var(--wine); cursor:pointer; }
.qty-display{ font-weight:bold; font-size:.85rem; color:var(--wine); }
.hidden{ display:none !important; }
