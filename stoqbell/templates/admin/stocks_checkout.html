<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{ url_for('stocks.static', filename='assets/stoqbell-icon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - StoqBell</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        .brand-stoq { color: #f8fafc; }
        .brand-bell { color: #39FF14; }
        body { background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1rem; }
        .card { background: #1e293b; border: 1px solid rgba(14,165,233,0.2); border-radius: 1.25rem; padding: 2rem; max-width: 26rem; width: 100%; text-align: center; }
        .accent { color: #0ea5e9; }
        h1 { font-size: 1.5rem; font-weight: 800; margin: 0 0 0.5rem; }
        p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; }
        .btn { display: inline-block; margin-top: 1.5rem; background: linear-gradient(90deg, #0891b2 0%, #0ea5e9 100%); color: white; border: none; padding: 0.9rem 1.75rem; border-radius: 1rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .error { color: #fca5a5; font-size: 0.9rem; margin-top: 1rem; display: none; }
        .spinner { display: none; margin: 1.5rem auto 0; width: 2rem; height: 2rem; border: 3px solid rgba(14,165,233,0.25); border-top-color: #0ea5e9; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="display:flex;align-items:center;justify-content:center;gap:8px;">
            <img src="{{ url_for('stocks.static', filename='assets/stoqbell-icon-dark.svg') }}" alt="" width="28" height="28">
            <span class="brand-stoq">Stoq</span><span class="brand-bell">Bell</span>
        </h1>
        <p>Complete payment to activate your {{ price_display }}/month subscription. A secure Razorpay window will open automatically.</p>
        <button type="button" id="stocks-pay-btn" class="btn">Pay {{ price_display }}</button>
        <div class="spinner" id="stocks-spinner"></div>
        <p class="error" id="stocks-checkout-error"></p>
        <p class="error" id="stocks-checkout-login-link" style="display:none;">
            <a href="{{ url_for('stocks.stocks_admin_login') }}" style="color:#38bdf8;">Try logging in &rarr;</a>
        </p>
    </div>

    <script>
    (function() {
        const options = {
            key: {{ razorpay_key_id | tojson }},
            subscription_id: {{ subscription_id | tojson }},
            name: 'StoqBell',
            description: '{{ price_display }}/month subscription',
            prefill: {
                name: {{ prefill_name | tojson }},
                email: {{ prefill_email | tojson }}
            },
            theme: { color: '#0ea5e9' },
            handler: function(response) {
                document.getElementById('stocks-spinner').style.display = 'block';
                document.getElementById('stocks-pay-btn').disabled = true;
                fetch('{{ url_for("stocks.stocks_subscribe_verify") }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(response)
                }).then(function(r) { return r.json(); }).then(function(data) {
                    if (data.status === 'ok' && data.redirect) {
                        window.location.href = data.redirect;
                    } else {
                        // Razorpay only calls this handler once IT considers the
                        // payment successful -- so a failure past this point is
                        // our own verification step, not a failed charge. The
                        // webhook (the actual source of truth for activation,
                        // see /stocks/razorpay/webhook) may still activate the
                        // account moments later even though this browser-side
                        // call didn't -- telling the customer to "contact
                        // support" here was a dead end that made a very likely
                        // temporary hiccup look like a lost payment.
                        showPaymentReceivedButSetupPending(data.message);
                    }
                }).catch(function() {
                    showPaymentReceivedButSetupPending(null);
                });
            },
            modal: {
                ondismiss: function() {
                    document.getElementById('stocks-pay-btn').disabled = false;
                }
            }
        };

        function showError(msg) {
            document.getElementById('stocks-spinner').style.display = 'none';
            document.getElementById('stocks-pay-btn').disabled = false;
            const el = document.getElementById('stocks-checkout-error');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function showPaymentReceivedButSetupPending(serverMessage) {
            document.getElementById('stocks-spinner').style.display = 'none';
            document.getElementById('stocks-pay-btn').style.display = 'none';
            const el = document.getElementById('stocks-checkout-error');
            el.textContent = 'Your payment went through, but we hit a snag finishing setup here. '
                + 'This usually resolves within a minute or two -- try logging in below. '
                + (serverMessage ? '(' + serverMessage + ')' : '');
            el.style.display = 'block';
            document.getElementById('stocks-checkout-login-link').style.display = 'block';
        }

        const rzp = new Razorpay(options);
        rzp.on('payment.failed', function(response) {
            showError((response.error && response.error.description) || 'Payment failed. Please try again.');
        });

        const payBtn = document.getElementById('stocks-pay-btn');
        payBtn.addEventListener('click', function() {
            payBtn.disabled = true;
            rzp.open();
        });
        // Open automatically on load too, so the customer isn't stuck
        // reading a static page -- the button stays as a manual fallback
        // in case a popup/auto-open gets blocked by the browser.
        rzp.open();
    })();
    </script>
</body>
</html>
